<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>GitLab</title>
    <meta name="description" content="A modern GitLab web client with repository management, real-time file viewing, editing, commit tracking, and code reviews." />
    <meta property="og:title" content="GitLab" />
    <meta property="og:description" content="A modern GitLab web client with repository management, real-time file viewing, editing, commit tracking, and code reviews." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/gitlab_logo.png" />
    <meta name="theme-color" content="#e24329" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="bg-[#1e1e1e] text-[#d4d4d4] h-screen w-screen flex flex-col overflow-hidden antialiased font-sans">
    <div id="root" class="h-full w-full flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully:', reg.scope))
            .catch(err => console.error('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
